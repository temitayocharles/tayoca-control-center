name: Refresh dependency lockfile
on:
  push:
    branches: [feature/real-management-console]
    paths: [.github/workflows/dependency-lockfile-refresh.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Reclassify build tooling
        run: node -e "const f=require('fs'),p=require('./package.json'),a=['@tailwindcss/vite','@vitejs/plugin-react','tailwindcss','typescript','vite'];for(const n of a){if(!p.dependencies[n])throw Error(n);p.devDependencies[n]=p.dependencies[n];delete p.dependencies[n]}f.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=low --json > production-audit.json || true
          node -e "const a=JSON.parse(require('fs').readFileSync('production-audit.json'));console.log('Production audit:',a.metadata?.vulnerabilities||{})"
      - name: Commit validated files and remove generator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/dependency-lockfile-refresh.yml
          git commit -m 'build: classify build tooling as dev dependencies'
          git push origin HEAD:feature/real-management-console
