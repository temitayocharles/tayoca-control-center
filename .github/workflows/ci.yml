name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Browser startup smoke
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tayoca-vite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/tayoca-vite-preview.log
            echo "::error::Vite preview did not become ready"
            exit 1
          fi

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "::error::No Chrome/Chromium binary is available on the runner"
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:4173/ > /tmp/tayoca-rendered-dom.html

          grep -q 'Tayoca Control' /tmp/tayoca-rendered-dom.html
          grep -q 'Dashboard' /tmp/tayoca-rendered-dom.html
          grep -q 'Workflow Studio' /tmp/tayoca-rendered-dom.html
          grep -q 'Website CMS' /tmp/tayoca-rendered-dom.html
          grep -q 'Preferences' /tmp/tayoca-rendered-dom.html
          if grep -q 'Configure your n8n URL and API key' /tmp/tayoca-rendered-dom.html; then
            echo "::error::Legacy browser API-key configuration language is visible"
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:4173/content > /tmp/tayoca-cms-rendered-dom.html

          grep -q 'Website CMS' /tmp/tayoca-cms-rendered-dom.html
          grep -q 'All content' /tmp/tayoca-cms-rendered-dom.html
          grep -q 'New content' /tmp/tayoca-cms-rendered-dom.html
          grep -q 'Images and visual assets' /tmp/tayoca-cms-rendered-dom.html
          grep -q 'pages, sections, articles, products, media and global site settings' /tmp/tayoca-cms-rendered-dom.html
          grep -q 'Site settings' /tmp/tayoca-cms-rendered-dom.html
          grep -q 'Navigation, footer and contact' /tmp/tayoca-cms-rendered-dom.html

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:4173/api-keys > /tmp/tayoca-api-keys-compat-dom.html

          grep -q 'Settings' /tmp/tayoca-api-keys-compat-dom.html
          grep -q 'Credentials are managed server-side' /tmp/tayoca-api-keys-compat-dom.html
          grep -q 'not background or server-push notifications' /tmp/tayoca-api-keys-compat-dom.html
          if grep -q 'Never miss an important execution' src/components/LandingPage.tsx; then
            echo "::error::Landing page overstates in-session notification coverage"
            exit 1
          fi
          if grep -q 'API Keys & Credentials' /tmp/tayoca-api-keys-compat-dom.html; then
            echo "::error::Legacy credential catalog is still reachable through /api-keys"
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:4173/backups > /tmp/tayoca-backups-rendered-dom.html

          grep -q 'Restore backup' /tmp/tayoca-backups-rendered-dom.html
          grep -q 'unpublished drafts' /tmp/tayoca-backups-rendered-dom.html
          if grep -q 'Import to n8n requires' /tmp/tayoca-backups-rendered-dom.html; then
            echo "::error::Placeholder backup import behavior is visible"
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:4173/alerts > /tmp/tayoca-alerts-compat-dom.html

          grep -q 'Error Log' /tmp/tayoca-alerts-compat-dom.html
          if grep -q 'Alert Rules' /tmp/tayoca-alerts-compat-dom.html; then
            echo "::error::Browser-local alert management is still reachable through /alerts"
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:4173/errors > /tmp/tayoca-errors-rendered-dom.html

          grep -q 'does not replay the failed execution' /tmp/tayoca-errors-rendered-dom.html
          if grep -q 'Retry All' src/pages/ErrorLogPage.tsx || grep -q 'Retry workflow' src/pages/ErrorLogPage.tsx; then
            echo "::error::Error Log source still claims unsupported execution-retry semantics"
            exit 1
          fi

          if grep -q '<div id="root"></div>' /tmp/tayoca-rendered-dom.html; then
            echo "::error::React did not mount into #root"
            exit 1
          fi
