name: Target production dependency remediation

on:
  push:
    branches:
      - feature/real-management-console
    paths:
      - .github/workflows/security-lockfile-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Raise React Router security floor
        run: npm pkg set 'dependencies.react-router-dom=^7.18.2'

      - name: Refresh targeted runtime lock entries
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update react-router-dom ws --package-lock-only --ignore-scripts

      - name: Verify targeted secure versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const rr = lock.packages['node_modules/react-router']?.version;
          const rrd = lock.packages['node_modules/react-router-dom']?.version;
          const ws = lock.packages['node_modules/ws']?.version;
          const atLeast = (value, floor) => {
            const a = value.split('.').map(Number);
            const b = floor.split('.').map(Number);
            for (let i = 0; i < 3; i++) {
              if (a[i] > b[i]) return true;
              if (a[i] < b[i]) return false;
            }
            return true;
          };
          if (!rr || !atLeast(rr, '7.18.2') || rr.startsWith('8.')) throw new Error(`Unsafe react-router version: ${rr}`);
          if (!rrd || !atLeast(rrd, '7.18.2') || rrd.startsWith('8.')) throw new Error(`Unsafe react-router-dom version: ${rrd}`);
          if (!ws || !atLeast(ws, '8.21.0') || !ws.startsWith('8.')) throw new Error(`Unsafe ws version: ${ws}`);
          console.log({ reactRouter: rr, reactRouterDom: rrd, ws });
          NODE

      - name: Validate clean install
        run: npm ci

      - name: Verify production security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Validate lint
        run: npm run lint

      - name: Validate production build
        run: npm run build

      - name: Commit validated runtime remediation and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/security-lockfile-fix.yml
          git commit -m 'security: remediate production dependency advisories'
          git push origin HEAD:feature/real-management-console
