name: Security lockfile remediation

on:
  push:
    branches:
      - feature/real-management-console
    paths:
      - .github/workflows/security-lockfile-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Ensure manifest was not changed
        run: git diff --exit-code -- package.json

      - name: Validate clean install
        run: npm ci

      - name: Verify production security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Validate lint
        run: npm run lint

      - name: Validate production build
        run: npm run build

      - name: Commit validated lockfile and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/security-lockfile-fix.yml
          git commit -m 'security: remediate production dependency advisories'
          git push origin HEAD:feature/real-management-console
