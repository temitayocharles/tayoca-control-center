apiVersion: tayoca.io/v1
kind: ControlCenterAccessPolicy
metadata:
  name: tayoca-control-center
  description: Desired authentication, trusted-device, origin TLS, and access policy for the Tayoca Control Center.
spec:
  canonicalHost: control.tayoca.com

  session:
    duration: 720h
    browserBindingCookie: true

  identity:
    ownerSelector:
      source: runtime
      valueFrom: OWNER_IDENTITY
    providers:
      preferred:
        - name: GitHub via Cloudflare
          type: cloudflare-account
          restrictToAccountMembers: true
      fallback:
        - name: Email OTP
          type: onetimepin

  warp:
    authenticateViaWarp: true
    trustedPlatforms:
      - macOS
      - iOS
    enrollment:
      ownerScoped: true
      serviceMode: warp
      doNotRequireEnrollmentForFallback: true

  accessPolicies:
    - name: Trusted WARP device
      precedence: 1
      decision: allow
      include:
        - ownerIdentity: true
      require:
        - devicePosture: WARP

    - name: Owner only
      precedence: 2
      decision: allow
      include:
        - ownerIdentity: true
      require: []

  originProtection:
    denyRawVercelOrigin: true
    api:
      requireCanonicalHost: true
      verifyCloudflareAccessJwt: true
      failClosedWhenAccessConfigurationMissing: true

    tlsLifecycle:
      provider: vercel
      certificate:
        required: true
        autoRenew: true
        validationMethod: http-01
      bootstrapOrder:
        - cloudflareDnsMode: dns-only
        - requireVercelDomainConfigured: true
        - requireVercelCertificateIssued: true
        - requireHostnameBoundToReadyProductionDeployment: true
        - requireDirectHttpsHealthy: true
        - cloudflareDnsMode: proxied
        - requireCloudflareAccessLoginHealthy: true
      failurePolicy:
        onMissingCertificate: keep-dns-only
        onDirectTlsFailure: keep-dns-only
        onCloudflare525: disable-proxy-and-reconcile-origin-cert
        neverDowngradeTlsToFlexible: true

  invariants:
    - Never expose n8n or Forgejo credentials to the browser.
    - Never remove the owner fallback until all trusted devices are enrolled and verified.
    - WARP is the preferred low-friction authentication path on enrolled devices.
    - GitHub via Cloudflare is the preferred interactive fallback.
    - Email OTP remains emergency fallback only.
    - Never enable Cloudflare proxying before the Vercel origin certificate exists and direct HTTPS is healthy.
    - The canonical hostname must be bound to a READY production deployment before Cloudflare proxying is enabled.
    - A Cloudflare 525 on the control hostname is an origin-certificate failure and must fail closed until repaired.
